name: PR-Infra-Validation

trigger: none

pr:                   #“Jab koi Pull Request raise kare in branches ke against, tab pipeline automatically run karo.”
  branches:
   include:
    - feature/* 
    - main

pool: Agents

parameters:
- name: environment
  type: string
  default: dev
  values: [dev, test, qa, prod]

variables:
  sourcePath: "$(System.DefaultWorkingDirectory)/env/${{ parameters.environment }}"

stages:
- stage: ValidateAndScan
  displayName: "Terraform Validate & Scan"
  jobs:
  - job: Validation
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 1.6.6

    - script: terraform fmt -check -recursive
      workingDirectory: "$(sourcePath)"
      displayName: "Format Check"

    - script: terraform init -backend=false
      workingDirectory: "$(sourcePath)"
      displayName: "Init (No Backend)"

    - script: terraform validate
      workingDirectory: "$(sourcePath)"
      displayName: "Validate"

    - script: terraform plan
      workingDirectory: "$(sourcePath)"
      displayName: "Plan (Preview Only)"
